modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/rememberedheroes/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/rememberedheroes"
authors="Ember Bocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Villages remember the players who won their raids and give them Hero of the Village again whenever they come back.
Only needed on the server: players without the mod can join.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
